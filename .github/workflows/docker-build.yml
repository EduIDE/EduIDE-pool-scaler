name: Build and Push Docker Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      docker-file: Dockerfile
      image-name: eduide/eduide-pool-scaler
      docker-context: .
      # Not passed on a release: the shared workflow strips the leading v from
      # the release tag, an override would be used verbatim.
      image-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
      free-disk-space: false
    secrets: inherit
